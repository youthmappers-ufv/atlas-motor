# Catálogo de pranchas do atlas, comum a todos os municípios.
# Cada município, no seu temas.toml, só diz a situação de cada prancha (e, se quiser,
# troca a base de referência ou o recorte). Pranchas não citadas ficam "planejado".
#
#   id          identificador (nome dos arquivos de dados, da consulta e da prancha)
#   numero      ordem da prancha
#   titulo      título da prancha
#   consulta    arquivo em catalogo/consultas/ (Overpass QL; {{bbox}} = caixa do município)
#   referencia  base oficial padrão (pasta em dados/oficiais/ do município) ou "interno"
#   recorte     municipio | sede | ambos (mapas gerados)
#   cor         cor dos objetos do tema no mapa (#RRGGBB)
#   mapa        pontos (objetos sobre as vias de fundo) | linhas (o próprio tema é uma rede: vias, estradas)
#   indicadores além de total e nome: "servico" (endereço e horário), "vias" (km e pavimento)
# Como propor um tema novo: docs/novos-temas.md.

[[tema]]
id = "localizacao"
numero = 1
titulo = "Localização e limites"
consulta = "localizacao.overpassql"
referencia = "interno"
recorte = "municipio"
cor = "#7A1C1C"
mapa = "pontos"
indicadores = []

