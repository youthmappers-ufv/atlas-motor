# Retrato mensal do OpenStreetMap, proposto por pull request (dia 1 de cada mês ou manual).
# Requer em Settings > Actions > General: "Allow GitHub Actions to create and approve pull requests".
name: Atualizar dados do OSM

on:
  schedule:
    - cron: "@@MINUTO@@ @@HORA@@ 1 * *"      # dia 1; hora e minuto próprios do município (novo_local.py)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  atualizar:
    uses: youthmappers-ufv/atlas-motor/.github/workflows/atualizar-dados.yml@@@MOTOR@@
