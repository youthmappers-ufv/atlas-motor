# Modelo do livro do atlas. construir.py troca os {{marcadores}} pelos dados do
# atlas.toml do município e pela lista de pranchas ativas, e grava o resultado em
# <município>/_construcao/livro/_quarto.yml. Não editar o arquivo gerado.
project:
  type: book
  output-dir: _site
  resources:
    - _gerado/downloads/
    - _gerado/badges/                    # badges do README (endpoint do shields.io)

lang: pt-BR

book:
  title: "{{titulo}}"
  subtitle: "Mapas abertos do município, a partir do OpenStreetMap"
  author: {{autores}}
  publisher: "{{instituicao}}"
  site-url: {{site_url}}
  output-file: {{arquivo}}             # nome do PDF, sem acento (vai para URLs)
  downloads: [pdf]
  search: true
  page-footer:
    center: "{{rodape}}"
  chapters:
    - index.qmd
    - metodo.qmd
    - part: "Pranchas"
      chapters:
{{capitulos}}
    - dados.qmd

format:
  html:
    theme: [cosmo, brand, estilo.scss]     # cores, fontes e logo do _brand.yml
    toc: true
    number-sections: false
  pdf:
    documentclass: scrreprt
    papersize: a4
    pdf-engine: xelatex
    include-in-header: atlas-estilo.tex    # usa identidade.tex, gerado do _brand.yml
    template-partials: [before-body.tex]  # capa
    toc-title: Sumário
    atlas-edicao: "{{edicao}}"
    number-sections: false
    toc: true
    fig-pos: "H"
    geometry:
      - top=2.5cm
      - bottom=2.5cm
      - left=2.5cm
      - right=2.5cm
