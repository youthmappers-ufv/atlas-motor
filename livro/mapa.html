<!-- Mapa interativo das pranchas (só no site). Cada <div class="atlas-mapa"> gerado por construir.py
     recebe um mapa Leaflet com os mesmos dados dos mapas do PDF: o tema no OpenStreetMap e, nos temas
     com base oficial, a comparação das duas fontes. O Leaflet só é carregado nas páginas que têm mapa. -->
<script>
(function () {
  var caixas = document.querySelectorAll(".atlas-mapa");
  if (!caixas.length) return;

  var LEAFLET = "https://unpkg.com/leaflet@1.9.4/dist/";
  var FALTA = "#C62828", BORDO = "#7A1C1C", AGUA = "#3A7BD5";

  function carregar(pronto) {
    var css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = LEAFLET + "leaflet.css";
    css.integrity = "sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=";
    css.crossOrigin = "";
    document.head.appendChild(css);
    var js = document.createElement("script");
    js.src = LEAFLET + "leaflet.js";
    js.integrity = "sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=";
    js.crossOrigin = "";
    js.onload = pronto;
    js.onerror = function () { caixas.forEach(function (c) { c.classList.add("atlas-mapa-indisponivel"); }); };
    document.head.appendChild(js);
  }

  // Tudo o que vem dos dados (nomes do OSM e das bases oficiais) entra como texto, nunca como HTML.
  function ficha(titulo, linhas, link) {
    var div = document.createElement("div");
    var h = document.createElement("strong");
    h.textContent = titulo;
    div.appendChild(h);
    linhas.forEach(function (l) {
      if (!l[1]) return;
      var p = document.createElement("div");
      var r = document.createElement("span");
      r.className = "atlas-ficha-rotulo";
      r.textContent = l[0] + ": ";
      p.appendChild(r);
      p.appendChild(document.createTextNode(l[1]));
      div.appendChild(p);
    });
    if (link) {
      var a = document.createElement("a");
      a.href = "https://www.openstreetmap.org/" + encodeURI(link);
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "Ver no OpenStreetMap";
      div.appendChild(a);
    }
    return div;
  }

  var ROTULOS = {"addr:street": "Rua", "addr:housenumber": "Número", "opening_hours": "Horário", "operator": "Responsável",
                 "surface": "Pavimento", "highway": "Tipo de via", "amenity": "Tipo", "shop": "Loja", "landuse": "Uso",
                 "natural": "Natureza", "waterway": "Curso d'água", "place": "Lugar", "building": "Edificação"};

  function fichaOsm(f) {
    var t = f.properties.tags || {};
    var linhas = Object.keys(ROTULOS).filter(function (k) { return t[k]; }).map(function (k) { return [ROTULOS[k], t[k]]; });
    return ficha(t.name || "Sem nome no mapa", linhas, f.properties.osm);
  }

  function ler(url) {
    return fetch(url).then(function (r) { if (!r.ok) throw new Error(url); return r.json(); });
  }

  function montar(caixa) {
    var d = caixa.dataset, cor = d.cor || "#304068";
    var mapa = L.map(caixa, {scrollWheelZoom: false});
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">colaboradores do OpenStreetMap</a>'
    }).addTo(mapa);
    mapa.on("click", function () { mapa.scrollWheelZoom.enable(); });   // a roda rola a página até o mapa ser clicado
    var camadas = L.control.layers(null, null, {collapsed: false}).addTo(mapa);

    ler(d.limite).then(function (g) {
      var limite = L.geoJSON(g, {style: {color: BORDO, weight: 2, dashArray: "6 4", fill: false}, interactive: false}).addTo(mapa);
      mapa.fitBounds(limite.getBounds());
    }).catch(function () { mapa.setView([-15, -50], 4); });

    ler(d.tema).then(function (g) {
      var tema = L.geoJSON(g, {
        style: function (f) {
          var t = f.properties.tags || {}, agua = t.waterway || t.natural === "water" || t.natural === "wetland";
          return {color: agua ? AGUA : cor, weight: d.forma === "pontos" ? 1 : 2, fillOpacity: 0.35};
        },
        pointToLayer: function (f, ll) {
          var comNome = (f.properties.tags || {}).name;
          return L.circleMarker(ll, {radius: 6, color: comNome ? "#fff" : cor, weight: comNome ? 1 : 2,
                                     fillColor: comNome ? cor : "#fff", fillOpacity: 1});
        },
        onEachFeature: function (f, camada) { camada.bindPopup(function () { return fichaOsm(f); }); }
      });
      camadas.addOverlay(tema, "OpenStreetMap: " + (d.titulo || "tema"));
      if (!d.comparacao) tema.addTo(mapa);        // com comparação, o mapa abre nela; o tema fica a um clique
    }).catch(function () { caixa.classList.add("atlas-mapa-indisponivel"); });

    if (!d.comparacao) return;
    ler(d.comparacao).then(function (g) {
      // Comparação por contagem (setores) ou por nomes (logradouros): cada feição traz o rótulo e a
      // cor da sua classe, os mesmos do mapa do PDF. Uma camada por classe, na ordem do arquivo.
      if (g.features.length && g.features[0].properties.cor) {
        var classes = [];
        g.features.forEach(function (f) { if (classes.indexOf(f.properties.rotulo) < 0) classes.push(f.properties.rotulo); });
        classes.forEach(function (rotulo) {
          var camada = L.geoJSON(g, {
            filter: function (f) { return f.properties.rotulo === rotulo; },
            style: function (f) { return {color: f.properties.cor, weight: f.geometry.type.indexOf("Polygon") >= 0 ? 1 : 3,
                                          fillColor: f.properties.cor, fillOpacity: 0.55}; },
            onEachFeature: function (f, c) {
              var p = f.properties;
              c.bindPopup(function () {
                return p.unidade
                  ? ficha("Setor " + p.unidade, [["Situação", p.situacao], ["Nº na tabela", String(p.n)],
                                                 ["Na base oficial", String(p.oficial)], ["No OpenStreetMap", String(p.osm)],
                                                 ["Razão", p.razao === null ? "" : String(p.razao).replace(".", ",") + "%"]])
                  : ficha(p.nome || "Sem nome na base oficial", [["Situação", p.rotulo]]);
              });
            }
          }).addTo(mapa);
          camadas.addOverlay(camada, rotulo);
        });
        return;
      }
      var grupos = {
        ambas: {rotulo: "Nas duas fontes", estilo: {radius: 6, color: "#fff", weight: 1, fillColor: cor, fillOpacity: 1}},
        so_osm: {rotulo: "Só no OpenStreetMap", estilo: {radius: 6, color: cor, weight: 2, fillColor: "#fff", fillOpacity: 1}},
        so_oficial: {rotulo: "Só na base oficial (falta no mapa)", estilo: {radius: 7, color: "#fff", weight: 1, fillColor: FALTA, fillOpacity: 1}}
      };
      Object.keys(grupos).forEach(function (situacao) {
        var grupo = grupos[situacao];
        var camada = L.geoJSON(g, {
          filter: function (f) { return f.properties.situacao === situacao; },
          pointToLayer: function (f, ll) { return L.circleMarker(ll, grupo.estilo); },
          onEachFeature: function (f, c) {
            var p = f.properties;
            c.bindPopup(function () {
              return ficha(p.nome || "Sem nome", [["Situação", grupo.rotulo], ["Nº na tabela", p.n ? String(p.n) : ""],
                                                  ["Código oficial", p.codigo], ["Motivo provável", p.motivo]], p.osm);
            });
            if (p.n) c.bindTooltip(String(p.n), {permanent: true, direction: "right", className: "atlas-numero", offset: [6, 0]});
          }
        }).addTo(mapa);
        camadas.addOverlay(camada, grupo.rotulo);
      });
    }).catch(function () {});
  }

  carregar(function () { caixas.forEach(montar); });
})();
</script>
