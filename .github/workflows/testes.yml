# CI do próprio motor: testes e construção do município de exemplo (testes/exemplo/).
# Uma mudança no motor só entra com isto verde; depois, uma tag vX.Y.Z a disponibiliza
# para os municípios (que atualizam com scripts/atualizar_motor.py).
name: Testes do motor

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Testes
        run: python -m unittest discover -s testes -v
      - name: Validar o município de exemplo
        run: python scripts/validar.py --local testes/exemplo
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18           # versão testada com o modelo do livro
      - name: Construir o site do município de exemplo
        run: python scripts/construir.py --local testes/exemplo --renderizar html
